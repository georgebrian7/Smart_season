{% extends 'base.html' %}
{% block title %}Login - SmartSeason{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="mb-3">Login</h3>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <hr>
        <p class="small">Don't have an account? <a href="{% url 'auth:register' %}">Register</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
